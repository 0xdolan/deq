name: Translation (Sorani / Kurmanji)
description: Fix or improve a translation.
labels: ["type: i18n", "status: triage"]
body:
  - type: dropdown
    id: lang
    attributes:
      label: Language
      options: [Sorani (ckb), Kurmanji (kmr), English (en)]
    validations: { required: true }
  - type: input
    id: page
    attributes:
      label: Page or URL
    validations: { required: true }
  - type: textarea
    id: change
    attributes:
      label: Current text and suggested text
    validations: { required: true }
