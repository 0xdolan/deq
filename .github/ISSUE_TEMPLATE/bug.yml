name: Bug report
description: Something does not work as documented.
labels: ["type: bug", "status: triage"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Website / Studio, npm packages, Python, Rust, CLI, Fonts, Exports, Docs, Other]
    validations: { required: true }
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations: { required: true }
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. ...\n2. ...\n3. ..."
    validations: { required: true }
  - type: input
    id: version
    attributes:
      label: Deq version, OS, browser or runtime
    validations: { required: true }
