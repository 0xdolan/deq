# uv workspace root (not a package). See python/ for members.
[project]
name = "deq-workspace"
version = "0.0.0"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"

[tool.uv]
package = false
# Supply-chain age gate, same as pnpm minimumReleaseAge.
exclude-newer = "7 days"

[tool.uv.workspace]
members = ["python/*", "scripts/deq-assets"]

[tool.uv.sources]
deq-shapes = { workspace = true }
deq-assets = { workspace = true }

[dependency-groups]
dev = [
    "deq-shapes",
    "deq-assets",
    "pytest>=8",
    "pytest-cov>=6",
    "hypothesis>=6",
    "mypy>=1.15",
    "ruff>=0.11",
    "pip-audit>=2.9",
    "zizmor>=1.16",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["python/*/src", "python/*/tests", "scripts/*/src", "scripts/*/tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "N", "C4", "SIM", "RUF", "PT", "ANN"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101"]

[tool.mypy]
strict = true
python_version = "3.12"
files = [
    "python/deq-shapes/src",
    "python/deq-shapes/tests",
    "scripts/deq-assets/src",
    "scripts/deq-assets/tests",
]

[tool.pytest.ini_options]
addopts = "--strict-markers --cov=deq_shapes --cov=deq_assets --cov-report=term-missing:skip-covered --cov-fail-under=95"
testpaths = ["python", "scripts/deq-assets/tests"]
