# Git hooks. Installed by `just setup` (or `pnpm exec lefthook install`).
pre-commit:
  parallel: true
  commands:
    forbidden-files:
      run: just forbidden
    secrets:
      run: gitleaks git --pre-commit --staged --redact --no-banner .
    prettier:
      glob: "*.{js,ts,tsx,json,md,yml,yaml,css,html,mdx}"
      run: pnpm exec prettier --check {staged_files}
    eslint:
      glob: "*.{js,ts,tsx}"
      run: pnpm exec eslint --max-warnings 0 {staged_files}
    ruff:
      glob: "*.py"
      run: uv run ruff check {staged_files} && uv run ruff format --check {staged_files}
    rustfmt:
      glob: "*.rs"
      run: cargo fmt --all --check
    actionlint:
      glob: ".github/workflows/*.{yml,yaml}"
      run: actionlint

commit-msg:
  commands:
    commitlint:
      run: pnpm exec commitlint --edit {1}

pre-push:
  commands:
    typecheck-and-test:
      run: just typecheck test
