[workspace]
resolver = "3"
members = ["rust/deq-shapes", "rust/deq-cli"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-or-later"
authors = ["0xdolan <0xdolan@gmail.com>"]
repository = "https://github.com/0xdolan/deq"
homepage = "https://0xdolan.github.io/deq/"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[profile.release]
lto = true
codegen-units = 1
strip = true
