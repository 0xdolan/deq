[project]
name = "deq-assets"
version = "0.0.0"
description = "Internal tool: inventory, process and verify Deq source images and animations. Not published."
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
authors = [{ name = "0xdolan", email = "0xdolan@gmail.com" }]
classifiers = ["Private :: Do Not Upload", "Typing :: Typed"]
dependencies = ["pillow==13.0.0"]

[project.scripts]
deq-assets = "deq_assets.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deq_assets"]
