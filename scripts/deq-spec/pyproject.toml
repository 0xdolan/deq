[project]
name = "deq-spec"
version = "0.0.0"
description = "Internal tool: validate, format and preview the Deq shape spec. Not published."
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
authors = [{ name = "0xdolan", email = "0xdolan@gmail.com" }]
classifiers = ["Private :: Do Not Upload", "Typing :: Typed"]
dependencies = [
    "jsonschema==4.26.0",
]

[project.scripts]
deq-spec = "deq_spec.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deq_spec"]
